<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#140b08">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon-v2.ico' | relative_url }}" sizes="any">
</head>
<body data-path="{{ page.url }}">
  <a class="skip-link" href="#main">Skip to the page</a>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Break The Glass, home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>
        <span class="brand-name">Break The Glass</span>
        <span class="brand-note">Arthur Thatch &amp; Meridian</span>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span aria-hidden="true">☰</span> Rooms
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/writing/' | relative_url }}">Writing</a>
      <a href="{{ '/scrapbook/' | relative_url }}">Scrapbook</a>
      <a href="{{ '/archive/' | relative_url }}">Memories</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-rule" aria-hidden="true"><span></span><i>✦</i><span></span></div>
    <p>Made by hand, one line at a time.</p>
    <p class="footer-small"><span data-year></span> · Somewhere beyond the ninth bearing · <a href="https://github.com/breaktheglass/breaktheglass.github.io">View the workshop</a></p>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
